text: >-
  With a needle, a thread, and a passion for the architecture of clothing, Erin Mackey provides high-end tailoring and custom costume services to the Calgary area.  
    
  Erin’s work exists at the intersection of technical precision and artistic storytelling. As a professional in the film and theatre industry, she understands that a garment is more than just fabric—it’s about fit, movement, and confidence. Whether she is meticulously restyling a vintage heirloom, installing a complex bustle on a bridal gown, or constructing a period-accurate costume from the ground up, her goal is always the same: perfection in the details.