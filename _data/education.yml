    description: Developed a comprehensive understanding of dramatic theory, performance techniques, and theatrical production. Participated in various stage productions, honing acting skills and gaining practical experience in live performance. Studied dramatic literature, history, and critical analysis, fostering a deep appreciation for the art form. Collaborated with peers and faculty on creative projects, enhancing teamwork and communication skills. Acquired proficiency in script analysis, character development, and the technical aspects of stagecraft. Engaged in coursework covering diverse theatrical genres, contributing to a well-rounded foundation in drama.
